# PLACEHOLDERS ONLY. This file is committed; the real values never are.
#
# base64 is encoding, not encryption — a real key here is -15 even "encrypted" that way (§5.3).
# The actual Secret is created at deploy time from GitHub Secrets:
#
#   kubectl -n civicpulse create secret generic civicpulse-secrets \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=GROQ_API_KEY="$GROQ_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# See .github/workflows/cd.yml. This manifest exists so `kustomize build` produces a complete,
# schema-valid set of objects, and so the shape of what is expected is reviewable.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
  annotations:
    civicpulse.io/managed-by: "cd.yml at deploy time — do not put real values here"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACED_AT_DEPLOY_TIME"
  GROQ_API_KEY: "REPLACED_AT_DEPLOY_TIME"
