# Release on a v* tag: build, push semver tags, generate release notes.
#
# Separate from cd.yml because a release is a different intent. cd.yml answers "is main
# deployable?" on every merge; this answers "this specific commit is a version people can pin to",
# which is why it publishes human-meaningful tags (v1.2.3, 1.2, 1) rather than a commit SHA.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  verify:
    name: verify the tagged commit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicpulse -d civicpulse_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TRIAGE_PROVIDER: simulated
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "55432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Backend suite
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4 pytest-cov==6.0.0 pytest-asyncio==0.25.0
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend suite
        working-directory: frontend
        run: |
          npm ci
          npm run test

  # ---------------------------------------------------------------------------
  publish:
    name: publish semver-tagged images
    runs-on: ubuntu-24.04
    needs: [verify]            # a tag is not a reason to skip the tests
    permissions:
      contents: write          # to create the GitHub Release
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the release notes can diff against the previous tag.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image namespace
        id: ns
        run: echo "ns=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Derive semver tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}/civicpulse-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Derive frontend tags
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}/civicpulse-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the released digests
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}/civicpulse-backend@${{ steps.backend.outputs.digest }}"
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## CivicPulse ${{ github.ref_name }}

            Municipal complaint intake, triage and operations platform.

            ### Images

            Deploy by digest, never by tag:

            ```
            civicpulse-backend@${{ steps.backend.outputs.digest }}
            civicpulse-frontend@${{ steps.frontend.outputs.digest }}
            ```

            ### Verify the signatures

            ```sh
            cosign verify \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}/civicpulse-backend@${{ steps.backend.outputs.digest }}
            ```

            ### Deploy

            ```sh
            kubectl apply -k k8s/overlays/prod
            ```
